name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-screenshots:
        description: Render new screenshot baselines (download them from the run's artifact)
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: CRD is up to date
        run: |
          cargo run --quiet --locked --bin crdgen > /tmp/apikeys.yaml
          diff -u deploy/crds/apikeys.yaml /tmp/apikeys.yaml
          diff -u deploy/crds/apikeys.yaml deploy/helm/you-spin-me/crds/apikeys.yaml
    env:
      # The screenshot tests are ignored here; the visual job runs them.
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"

  visual:
    # Pinned so fonts and rendering only change when the baselines do.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - name: Install Chromium for the pinned Playwright driver
        run: cargo run --locked --example install-browsers -- chromium --with-deps
      - name: Screenshot tests
        if: ${{ !inputs.update-screenshots }}
        run: make visual
      - name: Render new baselines
        if: ${{ inputs.update-screenshots }}
        run: make visual-update
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: screenshots
          path: tests/screenshots/
          if-no-files-found: ignore

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: make helm-lint

  openbao:
    runs-on: ubuntu-latest
    services:
      openbao:
        image: openbao/openbao:2.4.1
        env:
          BAO_DEV_ROOT_TOKEN_ID: root
        ports: ["8200:8200"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - name: Write-only policy against a real OpenBao
        env:
          YSM_TEST_OPENBAO_ADDR: http://127.0.0.1:8200
          YSM_TEST_OPENBAO_ROOT_TOKEN: root
        run: cargo test --locked --test openbao
    env:
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"

  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CSS is up to date
        run: |
          curl -sSfL -o /usr/local/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
          make css
          git diff --exit-code assets/dist/app.css

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
