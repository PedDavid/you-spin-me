apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apikeys.you-spin-me.prdv.cloud
spec:
  group: you-spin-me.prdv.cloud
  names:
    kind: ApiKey
    plural: apikeys
    shortNames:
    - ak
    singular: apikey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: string
    - jsonPath: .status.lastRotated
      name: Rotated
      type: date
    - jsonPath: .status.conditions[?(@.type=="Valid")].status
      name: Valid
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'An external API key: how it is set up, where to renew it and where it is written on rotation.'
        properties:
          spec:
            properties:
              consumers:
                description: Places that must be updated by hand, shown as a checklist.
                items:
                  type: string
                type: array
              displayName:
                description: Human-friendly name shown in the UI. Defaults to `metadata.name`.
                nullable: true
                type: string
              owner:
                description: Person or team responsible for the key.
                nullable: true
                type: string
              provider:
                default: generic
                description: Selects the expiry probe run when a new key is submitted.
                enum:
                - github
                - cloudflare
                - generic
                type: string
              renewUrl:
                description: Where to renew or recreate the key.
                nullable: true
                type: string
              rotation:
                default: {}
                properties:
                  criticalBefore:
                    description: Critical alert threshold before the deadline (default from config, 5d).
                    nullable: true
                    pattern: ^[0-9]+(s|m|h|d|w)$
                    type: string
                  maxAge:
                    description: Maximum age before the key must be rotated, e.g. `90d`.
                    nullable: true
                    pattern: ^[0-9]+(s|m|h|d|w)$
                    type: string
                  warnBefore:
                    description: Warning alert threshold before the deadline (default from config, 14d).
                    nullable: true
                    pattern: ^[0-9]+(s|m|h|d|w)$
                    type: string
                type: object
              setup:
                default: {}
                properties:
                  notes:
                    nullable: true
                    type: string
                  permissions:
                    description: Free-text permissions or scopes, shown as badges.
                    items:
                      type: string
                    type: array
                type: object
              targets:
                description: Secret stores the key is written to on rotation.
                items:
                  description: One storage target. Exactly one field must be set.
                  properties:
                    openbao:
                      nullable: true
                      properties:
                        key:
                          description: Key inside the secret, e.g. `token`.
                          minLength: 1
                          type: string
                        mount:
                          description: KV v2 mount, e.g. `secret`.
                          minLength: 1
                          type: string
                        path:
                          description: Path inside the mount, e.g. `ci/renovate`.
                          minLength: 1
                          type: string
                      required:
                      - key
                      - mount
                      - path
                      type: object
                  type: object
                type: array
            type: object
          status:
            nullable: true
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              expiresAt:
                description: 'Effective expiry: the probed value if there is one, otherwise the manual one.'
                format: date-time
                nullable: true
                type: string
              expiresAtSource:
                enum:
                - probe
                - manual
                - none
                - null
                nullable: true
                type: string
              history:
                description: Most recent first, bounded to [`HISTORY_LIMIT`] entries.
                items:
                  properties:
                    at:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      type: string
                    by:
                      description: |-
                        Who did something. `sub` is the stable OIDC subject and identifies the
                        person; `name` is only a display label and may change or collide.
                      properties:
                        name:
                          type: string
                        sub:
                          type: string
                      required:
                      - sub
                      type: object
                    expiresAt:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    kind:
                      enum:
                      - rotated
                      - recorded
                      type: string
                  required:
                  - at
                  - by
                  - kind
                  type: object
                type: array
              lastRotated:
                description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                format: date-time
                nullable: true
                type: string
              manualExpiresAt:
                description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                format: date-time
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              probe:
                nullable: true
                properties:
                  at:
                    description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                    format: date-time
                    type: string
                  expiresAt:
                    description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                    format: date-time
                    nullable: true
                    type: string
                  identity:
                    description: Who the key belongs to according to the provider. Never the key itself.
                    nullable: true
                    type: string
                required:
                - at
                type: object
              rotatedBy:
                description: |-
                  Who did something. `sub` is the stable OIDC subject and identifies the
                  person; `name` is only a display label and may change or collide.
                nullable: true
                properties:
                  name:
                    type: string
                  sub:
                    type: string
                required:
                - sub
                type: object
              targets:
                items:
                  properties:
                    lastWritten:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      nullable: true
                      type: string
                    ref:
                      type: string
                    result:
                      enum:
                      - ok
                      - failed
                      type: string
                  required:
                  - ref
                  - result
                  type: object
                type: array
            type: object
        required:
        - spec
        title: ApiKey
        type: object
    served: true
    storage: true
    subresources:
      status: {}
