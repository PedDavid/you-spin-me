# Delivering a rotated key to a workload: External Secrets Operator reads it
# from OpenBao (with its own read policy, separate from you-spin-me's) and
# keeps a Kubernetes Secret in sync.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: renovate
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-renovate
          serviceAccountRef:
            name: renovate-eso
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-env
  namespace: renovate
spec:
  # Rotations are planned days ahead, so an hour of propagation delay is fine.
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: renovate-env
    template:
      metadata:
        annotations:
          # Stakater Reloader restarts workloads that opt in when this changes.
          reloader.stakater.com/match: "true"
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: ci/renovate
        property: token
---
# On the consuming workload:
#
#   metadata:
#     annotations:
#       reloader.stakater.com/search: "true"
